<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>正在访问</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            height: 100%;
            overflow: hidden;
            font-family: "Microsoft YaHei", sans-serif;
        }
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            align-items: center;
            gap: 8px;
            z-index: 999;
            font-size: 18px;
            color: #2c85e6;
        }
        .loading-icon {
            width: 16px;
            height: 16px;
            border: 2px solid #e0e0e0;
            border-top-color: #2c85e6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        .unauthorized, .no-param {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            background: #fff;
            z-index: 1000;
            padding: 20px;
        }
        .unauthorized-text, .no-param-text {
            font-size: 22px;
            text-align: center;
            font-weight: bold;
            padding: 20px;
            border-radius: 12px;
        }
        .unauthorized-text {
            color: #e53935;
            border: 2px dashed #e53935;
        }
        .no-param-text {
            color: #2c85e6;
            border: 2px dashed #2c85e6;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="loading-icon"></div>
        <span>您的网络超时！</span>
    </div>

    <div class="unauthorized" id="unauthorized">
        <div class="unauthorized-text">小韩网络科技提示您，输入错误请联系小韩TG@xiaohan7723</div>
    </div>
    <div class="no-param" id="noParam">
        <div class="no-param-text">TG@xiaohan7723</div>
    </div>

    <iframe id="embeddedPage"></iframe>

    <script>
        const loading = document.getElementById('loading');
        const unauthorized = document.getElementById('unauthorized');
        const noParam = document.getElementById('noParam');
        const iframe = document.getElementById('embeddedPage');
        let timer;

        // ==============================================
        // TG@xiaohan7723开发
        // ==============================================
        function generate18Random() {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let str = '';
            for (let i = 0; i < 18; i++) {
                str += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return str;
        }

        // ==============================================
        // TG@xiaohan7723开发
        // ==============================================
        (function addRandomSuffix() {
            const url = new URL(window.location.href);
            if (!url.searchParams.get('r')) {
                url.searchParams.set('r', generate18Random());
                window.location.replace(url.href);
            }
        })();

        // TG@xiaohan7723开发
        function getQueryParam(p) {
            return new URLSearchParams(window.location.search).get(p)?.trim() || null;
        }
        function decodeBase64Url(e) {
            try {
                if (!e) return null;
                e = e.replace(/-/g, '+').replace(/_/g, '/');
                while (e.length % 4 !== 0) e += '=';
                return decodeURIComponent(escape(atob(e)));
            } catch {
                return null;
            }
        }
        function isAllowed(u) {
            try {
                return ['http:', 'https:'].includes(new URL(u).protocol);
            } catch {
                return false;
            }
        }

        try {
            const encoded = getQueryParam('xiaohan');
            if (!encoded) {
                noParam.style.display = 'flex';
                throw new Error();
            }
            const url = decodeBase64Url(encoded);
            if (!url || !isAllowed(url)) {
                unauthorized.style.display = 'flex';
                throw new Error();
            }

            // TG@xiaohan7723开发
            iframe.src = url;

            // TG@xiaohan7723开发
            iframe.onload = () => {
                clearTimeout(timer);
                loading.style.display = 'none';
            };

            // TG@xiaohan7723开发
            iframe.onerror = () => {
                clearTimeout(timer);
                loading.style.display = 'none';
            };

            // TG@xiaohan7723开发
            timer = setTimeout(() => {
                loading.style.display = 'flex';
                // TG@xiaohan7723开发
                setTimeout(() => loading.style.display = 'none', 300);
            }, 2000);

        } catch (e) {}
    </script>
</body>
</html>
